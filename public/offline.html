<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>オフライン - ぴっざぁ市民ポータル</title>
  <style>
    :root {
      --primary: #00ff88;
      --primary-glow: rgba(0, 255, 136, 0.3);
      --bg-dark: #0a0c10;
      --bg-grad-1: #16222f;
      --bg-grad-2: #090d14;
      --text-main: #f0f2f5;
      --text-muted: #8e9cae;
      --glass-bg: rgba(20, 26, 38, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --error: #ff4757;
      --font-sans: system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% -20%, var(--bg-grad-1), transparent),
        radial-gradient(circle at 0% 100%, var(--bg-grad-2), transparent);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.05);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-container {
      margin-bottom: 28px;
      position: relative;
      display: inline-block;
    }

    .logo-glow {
      position: absolute;
      inset: -10px;
      background: var(--primary);
      filter: blur(20px);
      opacity: 0.15;
      border-radius: 50%;
      animation: pulse 3s infinite ease-in-out;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 2;
    }

    .icon-wrapper {
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      position: relative;
    }

    .icon-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid var(--primary);
      opacity: 0;
      transform: scale(0.9);
      animation: ripple 2.5s infinite cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-pulse:nth-child(2) {
      animation-delay: 0.8s;
    }

    .icon-wrapper svg {
      color: var(--primary);
      width: 48px;
      height: 48px;
      position: relative;
      z-index: 3;
      filter: drop-shadow(0 0 10px var(--primary-glow));
      animation: iconFloat 4s infinite ease-in-out;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, var(--text-main), #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn {
      width: 100%;
      padding: 16px 28px;
      border-radius: 18px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      background: var(--primary);
      color: #000;
      box-shadow: 0 4px 12px var(--primary-glow);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: all 0.6s ease;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 6px var(--primary-glow);
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-loader {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid #000;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 71, 87, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 71, 87, 0.3);
      color: #ff6b81;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      z-index: 100;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      white-space: nowrap;
    }

    .toast.show {
      bottom: 32px;
      opacity: 1;
    }

    .toast.shake {
      animation: shake 0.4s ease;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(1.15); }
    }

    @keyframes ripple {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(-50%); }
      20%, 60% { transform: translateX(calc(-50% - 6px)); }
      40%, 80% { transform: translateX(calc(-50% + 6px)); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Pizza Logo Header -->
    <div class="logo-container">
      <div class="logo-glow"></div>
      <img src="pizza.webp" alt="Logo" class="logo" onerror="this.src='pizza.png'">
    </div>

    <!-- Glowing Wi-Fi Off Icon Wrapper -->
    <div class="icon-wrapper">
      <div class="icon-pulse"></div>
      <div class="icon-pulse"></div>
      <!-- SVG WiFi Off -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.83-2.84M7.34 7.34A15.6 15.6 0 0 1 12 6.5c3.22 0 6.13.97 8.54 2.63M12 18.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
      </svg>
    </div>

    <h1>接続できませんでした</h1>
    <p>ぴっざぁ市民ポータルをご利用いただくにはインターネット接続が必要です。設定を確認してから再試行してください。</p>

    <button class="btn" id="retryBtn" onclick="handleRetry()">
      <span class="btn-loader" id="loader"></span>
      <span id="btnText">再試行</span>
    </button>
  </div>

  <!-- Connection Status Toast -->
  <div class="toast" id="errorToast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>オフライン状態のままです</span>
  </div>

  <script>
    // Simulate haptic feedback if running on Capacitor
    function triggerHapticFeedback() {
      try {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) {
          window.Capacitor.Plugins.Haptics.impact({ style: 'light' });
        }
      } catch (e) {
        console.log("Haptic trigger skipped", e);
      }
    }

    function triggerWarningHapticFeedback() {
      try {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) {
          window.Capacitor.Plugins.Haptics.notification({ type: 'error' });
        }
      } catch (e) {
        console.log("Haptic trigger skipped", e);
      }
    }

    async function handleRetry() {
      triggerHapticFeedback();
      const btn = document.getElementById('retryBtn');
      const loader = document.getElementById('loader');
      const btnText = document.getElementById('btnText');
      const toast = document.getElementById('errorToast');

      btn.disabled = true;
      loader.style.display = 'inline-block';
      btnText.textContent = '接続を確認中...';

      // Minimum animation time to feel natural
      await new Promise(resolve => setTimeout(resolve, 800));

      // 1. Browser check
      if (!navigator.onLine) {
        showErrorToast();
        resetBtn();
        return;
      }

      // 2. Real request ping check
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500); // 3.5s timeout

        const response = await fetch('https://pizza-citzen-portal.pages.dev/api/timeline?userId=test', {
          method: 'GET',
          mode: 'no-cors',
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        // Success! Back online! Redirect back to app main page
        window.location.href = "https://pizza-citzen-portal.pages.dev";
      } catch (error) {
        console.log("Ping failed:", error);
        showErrorToast();
        resetBtn();
      }
    }

    function showErrorToast() {
      triggerWarningHapticFeedback();
      const toast = document.getElementById('errorToast');
      toast.classList.remove('show', 'shake');
      void toast.offsetWidth; // Trigger reflow to restart animation
      toast.classList.add('show', 'shake');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    // Initialize with a network check
    window.addEventListener('DOMContentLoaded', () => {
      // Setup webview offline hooks if any needed
    });

    function resetBtn() {
      const btn = document.getElementById('retryBtn');
      const loader = document.getElementById('loader');
      const btnText = document.getElementById('btnText');

      btn.disabled = false;
      loader.style.display = 'none';
      btnText.textContent = '再試行';
    }
  </script>
</body>
</html>
