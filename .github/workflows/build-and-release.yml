name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename and Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/pizza-portal.apk

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -e "const fs = require('fs'); const content = fs.readFileSync('src/utils/updater.ts', 'utf8'); const match = content.match(/CURRENT_VERSION\s*=\s*'([^']+)'/); console.log(match ? 'v' + match[1] : 'latest');")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/pizza-portal.apk
          tag_name: ${{ env.VERSION }}
          name: ${{ format('ぴっざぁ市民総合ポータル {0}', env.VERSION) }}
          draft: false
          prerelease: false
          body: |
            ### 🤖 自動リリース情報
            GitHub Actionsによって最新のAPKファイルが自動的にビルドされました。
            
            - **バージョン:** `${{ env.VERSION }}`
            - **ビルドトリガー:** `${{ github.ref_name }}` (${{ github.ref_type }})
            - **コミットハッシュ:** `${{ github.sha }}`
            - **コミットメッセージ:** 
              ```
              ${{ github.event.head_commit.message }}
              ```
            - **ビルド日時:** ${{ github.event.head_commit.timestamp || '不明' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
